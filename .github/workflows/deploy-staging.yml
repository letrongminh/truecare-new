name: deploy-staging

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_API_BASE_URL: https://truecare-new.noboil.dev
  EC2_SSH_USER: ${{ vars.EC2_SSH_USER || 'ec2-user' }}
  EC2_SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
  EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/truecare-new' }}

jobs:
  deploy-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install ssh key
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          test -n "$EC2_SSH_PRIVATE_KEY"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/truecare-new
          chmod 600 ~/.ssh/truecare-new
      - name: deploy over ssh
        env:
          EC2_HOST: ${{ vars.EC2_HOST }}
          EC2_SSH_KEY_PATH: /home/runner/.ssh/truecare-new
          DEPLOY_REF: origin/main
        run: make deploy-smoke
