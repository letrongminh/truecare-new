[project]
name = "truecare-api"
version = "0.1.0"
description = "TrueCare FastAPI foundation scaffold"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2.0",
  "argon2-cffi>=23.1,<26.0",
  "asyncpg>=0.30,<1.0",
  "cryptography>=43,<47",
  "fastapi>=0.115,<1.0",
  "greenlet>=3.1,<4.0",
  "httpx>=0.27,<1.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.32,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests requiring local Postgres",
]
